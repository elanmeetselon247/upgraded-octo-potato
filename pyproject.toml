[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gituses"
version = "1.0.0"
description = "Unlimited self-hosted git over smart HTTP: no repo, user, size or concurrency limits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
authors = [{ name = "gituses contributors" }]
keywords = ["git", "server", "http", "self-hosted", "unlimited"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "License :: OSI Approved :: The Unlicense (Unlicense)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gituses = "gituses.cli:main"

[tool.setuptools]
packages = ["gituses"]
